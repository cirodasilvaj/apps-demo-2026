name: CI/CD Pipeline - QA Tests, SonarQube Security Scan & GHCR Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  qa-and-sonarqube:
    name: QA Unit Tests & SonarQube Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 for QA Tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python QA Unit Tests & Coverage
        working-directory: ./python-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov bandit
          pytest test_app.py -v --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml
          bandit -r app.py -f json -o bandit-report.json || true

      - name: Setup .NET 8 SDK & Verify C# Build
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build & Verify .NET 8 C# App
        working-directory: ./dotnet-csharp-app
        run: |
          dotnet restore DotnetDemoApp.csproj
          dotnet build DotnetDemoApp.csproj --configuration Release --no-restore

      - name: Run SonarQube QA & Security Scan (if SONAR_HOST_URL is reachable)
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://a89c266b705504783b7c6ba6be8b546e-467327433.us-east-1.elb.amazonaws.com:9000' }}
          SONAR_USER: ${{ secrets.SONAR_USER || 'admin' }}
          SONAR_PASSWORD: ${{ secrets.SONAR_PASSWORD || 'Sonar@2026' }}
        run: |
          if curl -fsS --max-time 10 "${SONAR_HOST_URL}/api/system/status" | grep -q '"status":"UP"'; then
            echo "SonarQube server is UP at ${SONAR_HOST_URL} — running sonar-scanner CLI..."
            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/usr/src" \
              -w /usr/src \
              sonarsource/sonar-scanner-cli:latest \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.login="${SONAR_USER}" \
              -Dsonar.password="${SONAR_PASSWORD}" \
              -Dsonar.projectKey=apps-demo-2026 \
              -Dsonar.projectName="Apps Demo 2026 (Python & .NET C#)" \
              -Dsonar.sources=python-app/app.py,k8s \
              -Dsonar.tests=python-app \
              -Dsonar.test.inclusions=**/test_*.py \
              -Dsonar.python.coverage.reportPaths=python-app/coverage.xml
          else
            echo "SonarQube server at ${SONAR_HOST_URL} not currently reachable (demo account may be recreating); skipping remote upload."
          fi

  build-and-test:
    needs: qa-and-sonarqube
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: python-app
            context: ./python-app
          - name: dotnet-csharp-app
            context: ./dotnet-csharp-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (${{ matrix.app.name }})
        run: |
          IMAGE="ghcr.io/cirodasilvaj/apps-demo-2026/${{ matrix.app.name }}"
          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${{ github.sha }}" "${{ matrix.app.context }}"

      - name: Smoke test container (${{ matrix.app.name }})
        run: |
          IMAGE="ghcr.io/cirodasilvaj/apps-demo-2026/${{ matrix.app.name }}:latest"
          docker run -d --name test-app -p 8080:8080 "${IMAGE}"
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "=== /api/info JSON ==="
          curl -fsS -H "X-Forwarded-For: 203.0.113.42" http://127.0.0.1:8080/api/info | jq .
          echo "=== / HTML Preview ==="
          curl -fsS -H "X-Forwarded-For: 203.0.113.42" http://127.0.0.1:8080/ | grep -E "value|title"
          docker rm -f test-app

      - name: Push Docker image to GHCR (${{ matrix.app.name }})
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/cirodasilvaj/apps-demo-2026/${{ matrix.app.name }}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
