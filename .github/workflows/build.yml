name: CI/CD Pipeline - QA Tests, SonarQube Security Scan & GHCR Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  qa-and-sonarqube:
    name: QA Unit Tests & SonarQube Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 for QA Tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python QA Unit Tests & Coverage
        working-directory: ./python-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov bandit
          pytest test_app.py -v --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml
          bandit -r app.py -f json -o bandit-report.json || true

      - name: Setup .NET 8 SDK & Verify C# Build
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build & Verify .NET 8 C# App
        working-directory: ./dotnet-csharp-app
        run: |
          dotnet restore DotnetDemoApp.csproj
          dotnet build DotnetDemoApp.csproj --configuration Release --no-restore

      - name: Configure AWS credentials (for SonarQube & Route 53 discovery)
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Run SonarQube QA & Security Scan (if SONAR_HOST_URL is reachable)
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_USER: ${{ secrets.SONAR_USER || 'admin' }}
          SONAR_PASSWORD: ${{ secrets.SONAR_PASSWORD || 'admin' }}
        run: |
          TARGET_URL="${SONAR_HOST_URL:-}"
          if [ -z "$TARGET_URL" ] || ! curl -fsS --max-time 5 "${TARGET_URL}/api/system/status" 2>/dev/null | grep -q '"status":"UP"'; then
            ZONE_NAME=$(aws route53 list-hosted-zones --query "HostedZones[?contains(Name, 'realhandsonlabs.net') && Config.PrivateZone == \`false\`].Name | [0]" --output text 2>/dev/null | sed 's/\.$//' || true)
            if [ -z "$ZONE_NAME" ] || [ "$ZONE_NAME" = "None" ]; then
              ZONE_NAME=$(aws route53 list-hosted-zones --query "HostedZones[?Config.PrivateZone == \`false\`].Name | [0]" --output text 2>/dev/null | sed 's/\.$//' || true)
            fi
            if [ -n "$ZONE_NAME" ] && [ "$ZONE_NAME" != "None" ]; then
              if curl -fsS --max-time 5 "http://sonarqube.${ZONE_NAME}/api/system/status" 2>/dev/null | grep -q '"status":"UP"'; then
                TARGET_URL="http://sonarqube.${ZONE_NAME}"
              fi
            fi
          fi
          if [ -n "$TARGET_URL" ] && curl -fsS --max-time 10 "${TARGET_URL}/api/system/status" 2>/dev/null | grep -q '"status":"UP"'; then
            echo "SonarQube server is UP at ${TARGET_URL} — running sonar-scanner CLI..."
            TARGET_USER="${SONAR_USER:-admin}"
            TARGET_PASS="${SONAR_PASSWORD:-admin}"
            if ! curl -fsS -u "${TARGET_USER}:${TARGET_PASS}" "${TARGET_URL}/api/authentication/validate" 2>/dev/null | grep -q '"valid":true'; then
              if curl -fsS -u "admin:admin" "${TARGET_URL}/api/authentication/validate" 2>/dev/null | grep -q '"valid":true'; then
                TARGET_USER="admin"
                TARGET_PASS="admin"
              fi
            fi
            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/usr/src" \
              -w /usr/src \
              sonarsource/sonar-scanner-cli:latest \
              -Dsonar.host.url="${TARGET_URL}" \
              -Dsonar.login="${TARGET_USER}" \
              -Dsonar.password="${TARGET_PASS}" \
              -Dsonar.projectKey=apps-demo-2026 \
              -Dsonar.projectName="Apps Demo 2026 (Python & .NET C#)" \
              -Dsonar.sources=python-app/app.py,k8s \
              -Dsonar.tests=python-app \
              -Dsonar.test.inclusions=**/test_*.py \
              -Dsonar.python.coverage.reportPaths=python-app/coverage.xml || echo "SonarQube scan completed with warnings."
          else
            echo "SonarQube server at ${TARGET_URL:-auto-discover} not currently reachable; skipping remote upload."
          fi

  build-and-test:
    needs: qa-and-sonarqube
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: python-app
            context: ./python-app
          - name: dotnet-csharp-app
            context: ./dotnet-csharp-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (${{ matrix.app.name }})
        run: |
          IMAGE="ghcr.io/cirodasilvaj/apps-demo-2026/${{ matrix.app.name }}"
          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${{ github.sha }}" "${{ matrix.app.context }}"

      - name: Smoke test container (${{ matrix.app.name }})
        run: |
          IMAGE="ghcr.io/cirodasilvaj/apps-demo-2026/${{ matrix.app.name }}:latest"
          docker run -d --name test-app -p 8080:8080 "${IMAGE}"
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "=== /api/info JSON ==="
          curl -fsS -H "X-Forwarded-For: 203.0.113.42" http://127.0.0.1:8080/api/info | jq .
          echo "=== / HTML Preview ==="
          curl -fsS -H "X-Forwarded-For: 203.0.113.42" http://127.0.0.1:8080/ | grep -E "value|title"
          docker rm -f test-app

      - name: Push Docker image to GHCR (${{ matrix.app.name }})
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/cirodasilvaj/apps-demo-2026/${{ matrix.app.name }}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

  deploy-and-sync-dns:
    name: Deploy to EKS & Register Route 53 DNS
    needs: [build-and-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Connect to EKS Cluster
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          aws eks update-kubeconfig --name kube-demo-eks --region "${{ secrets.AWS_REGION || 'us-east-1' }}" || true

      - name: Provision Dashboards in Grafana (Dashboard-as-Code)
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          ZONE_NAME=$(aws route53 list-hosted-zones --query "HostedZones[?contains(Name, 'realhandsonlabs.net') && Config.PrivateZone == \`false\`].Name | [0]" --output text 2>/dev/null | sed 's/\.$//' || true)
          if [ -z "$ZONE_NAME" ] || [ "$ZONE_NAME" = "None" ]; then
            ZONE_NAME=$(aws route53 list-hosted-zones --query "HostedZones[?Config.PrivateZone == \`false\`].Name | [0]" --output text 2>/dev/null | sed 's/\.$//' || true)
          fi
          GRAFANA_URL="http://grafana.${ZONE_NAME}"
          echo "📊 Checking Grafana API at ${GRAFANA_URL}..."
          if curl -fsS --max-time 5 "${GRAFANA_URL}/api/health" >/dev/null 2>&1; then
            if [ -f "python-app/grafana/dashboard.json" ]; then
              echo "📈 Provisioning Python App Golden Signals Dashboard..."
              curl -fsS -u "admin:Grafana@2026" -X POST "${GRAFANA_URL}/api/dashboards/db" \
                -H "Content-Type: application/json" -d @python-app/grafana/dashboard.json || true
            fi
            if [ -f "dotnet-csharp-app/grafana/dashboard.json" ]; then
              echo "📈 Provisioning .NET C# App Golden Signals Dashboard..."
              curl -fsS -u "admin:Grafana@2026" -X POST "${GRAFANA_URL}/api/dashboards/db" \
                -H "Content-Type: application/json" -d @dotnet-csharp-app/grafana/dashboard.json || true
            fi
          fi

      - name: Apply Kubernetes Manifests & Sync Route 53 DNS
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          kubectl apply -f k8s/apps-demo.yaml || true
          chmod +x scripts/sync-dns-route53.sh
          ./scripts/sync-dns-route53.sh

          ZONE_NAME=$(aws route53 list-hosted-zones --query "HostedZones[?contains(Name, 'realhandsonlabs.net') && Config.PrivateZone == \`false\`].Name | [0]" --output text 2>/dev/null | sed 's/\.$//' || true)
          if [ -z "$ZONE_NAME" ] || [ "$ZONE_NAME" = "None" ]; then
            ZONE_NAME=$(aws route53 list-hosted-zones --query "HostedZones[?Config.PrivateZone == \`false\`].Name | [0]" --output text 2>/dev/null | sed 's/\.$//' || true)
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -n "$ZONE_NAME" ] && [ "$ZONE_NAME" != "None" ]; then
            echo "### 🌐 Apps Demo - Live Endpoints on Route 53" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Application | HTTP / HTTPS URL | Metrics |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Python 3.12 Flask App** | https://python.${ZONE_NAME} (or http) | http://python.${ZONE_NAME}/metrics |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **.NET 8 C# Minimal API** | https://dotnet.${ZONE_NAME} (or http) | http://dotnet.${ZONE_NAME}/metrics |" >> "$GITHUB_STEP_SUMMARY"
          fi
