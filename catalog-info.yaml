apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: apps-demo-2026
  title: Apps Demo 2026 Ecosystem
  description: Microservices Demo Collection (Python 3.12 Flask, .NET 8 C# Minimal API) with CI/CD, SonarQube, Prometheus Metrics, Fluentd/Loki Logs, GitOps via ArgoCD and HTTPS via AWS ACM.
spec:
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: python-demo-app
  title: Python 3.12 Flask Microservice
  description: App Web em Python 3.12 (Flask) com Prometheus metrics, logs JSON para Grafana Loki, SonarQube Quality Gate, GitOps via ArgoCD e HTTPS via AWS ACM.
  annotations:
    backstage.io/techdocs-ref: dir:./python-app
    sonarqube.org/project-key: apps-demo-2026
    backstage.io/kubernetes-id: python-app
    backstage.io/kubernetes-namespace: apps-demo
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    fluentd.io/destination: "loki"
    grafana/dashboard-selector: "python-demo-app"
    grafana/tag-selector: "service:python-demo-app"
    grafana/overview-dashboard: "http://grafana.799416476486.realhandsonlabs.net/d/python-demo-app-dashboard/cd51c12"
    argocd/app-name: python-app
  tags:
    - python
    - flask
    - sonarqube
    - prometheus
    - fluentd
    - loki
    - grafana
    - k8s
    - argocd
  links:
    - url: https://github.com/cirodasilvaj/apps-demo-2026/tree/main/python-app
      title: GitHub Source Code
      icon: github
    - url: http://python.799416476486.realhandsonlabs.net
      title: Python 3.12 Live App (HTTP)
      icon: web
    - url: https://python.799416476486.realhandsonlabs.net
      title: Python 3.12 Live App (HTTPS ACM)
      icon: lock
    - url: http://python.799416476486.realhandsonlabs.net/metrics
      title: Prometheus Metrics (/metrics)
      icon: gauge
    - url: http://grafana.799416476486.realhandsonlabs.net/d/apps-prometheus-loki/8c87aef
      title: Grafana Dashboard (Prometheus & Loki Logs)
      icon: dashboard
    - url: http://sonarqube.799416476486.realhandsonlabs.net/dashboard?id=apps-demo-2026
      title: SonarQube Quality Gate
      icon: check
    - url: https://argocd.799416476486.realhandsonlabs.net/applications/python-app
      title: ArgoCD GitOps
      icon: sync
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: apps-demo-2026
  providesApis:
    - python-app-api
  dependsOn:
    - resource:default/kube-demo-eks
---
