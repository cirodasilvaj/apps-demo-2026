apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: apps-demo-2026
  description: Coleção de Apps Web de exemplo em múltiplas linguagens (Python 3.12, .NET 8 C#) com CI/CD, SonarQube, Prometheus Metrics e logs Fluentd -> Grafana Loki
spec:
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: python-demo-app
  title: Python 3.12 Flask Microservice
  description: App Web em Python 3.12 (Flask) instrumentada com Prometheus (/metrics), logs JSON enviados via Fluentd para o Grafana Loki e Quality Gate no SonarQube.
  annotations:
    sonarqube.org/project-key: apps-demo-2026
    backstage.io/kubernetes-id: python-app
    backstage.io/kubernetes-namespace: apps-demo
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    fluentd.io/destination: "loki"
    grafana/dashboard-selector: "tag == 'python-demo-app'"
    grafana/overview-dashboard: "http://grafana.realhandsonlabs.net/d/apps-prometheus-loki/8c87aef"
  tags:
    - python
    - flask
    - sonarqube
    - prometheus
    - fluentd
    - loki
    - grafana
    - k8s
  links:
    - url: https://github.com/cirodasilvaj/apps-demo-2026/tree/main/python-app
      title: GitHub Source Code
      icon: github
    - url: http://python.realhandsonlabs.net
      title: Python 3.12 Live App (Route 53)
      icon: web
    - url: http://python.realhandsonlabs.net/metrics
      title: Prometheus Metrics (/metrics)
      icon: gauge
    - url: http://grafana.realhandsonlabs.net
      title: Grafana Dashboard (Prometheus & Loki Logs)
      icon: dashboard
    - url: http://sonarqube.realhandsonlabs.net/dashboard?id=apps-demo-2026
      title: SonarQube Quality Gate
      icon: check
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: apps-demo-2026
  dependsOn:
    - resource:default/kube-demo-eks
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dotnet-csharp-demo-app
  title: .NET 8 C# Minimal API Microservice
  description: App Web em C# (.NET 8 Minimal API) instrumentada com Prometheus (/metrics), logs JSON enviados via Fluentd para o Grafana Loki e Quality Gate no SonarQube.
