apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: python-app-api
  title: Python Flask App REST API
  description: Interface REST para consulta de status, saúde e telemetria da aplicação Python
spec:
  type: openapi
  lifecycle: production
  owner: platform-team
  system: apps-demo-2026
  definition: |
    openapi: "3.0.0"
    info:
      title: Python App API
      version: "1.0.0"
    paths:
      /:
        get:
          summary: Overview & HTML Dashboard
          responses:
            '200':
              description: OK
      /api/info:
        get:
          summary: System & client runtime information
          responses:
            '200':
              description: OK
      /healthz:
        get:
          summary: Liveness probe
          responses:
            '200':
              description: OK
      /ready:
        get:
          summary: Readiness probe
          responses:
            '200':
              description: OK
      /metrics:
        get:
          summary: Prometheus metrics
          responses:
            '200':
              description: OK
---
