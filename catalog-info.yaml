    fluentd.io/destination: "loki"
    grafana/dashboard-selector: "tag == 'dotnet-csharp-demo-app'"
    grafana/overview-dashboard: "http://grafana.realhandsonlabs.net/d/apps-prometheus-loki/8c87aef"
  tags:
    - dotnet
    - csharp
    - sonarqube
    - prometheus
    - fluentd
    - loki
    - grafana
    - k8s
  links:
    - url: https://github.com/cirodasilvaj/apps-demo-2026/tree/main/dotnet-csharp-app
      title: GitHub Source Code
      icon: github
    - url: http://dotnet.realhandsonlabs.net
      title: .NET 8 C# Live App (Route 53)
      icon: web
    - url: http://dotnet.realhandsonlabs.net/metrics
      title: Prometheus Metrics (/metrics)
