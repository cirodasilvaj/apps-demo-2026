apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: dotnet-csharp-demo-app
  title: .NET 8 C# Minimal API Microservice
  description: App Web em C# (.NET 8 Minimal API) com Prometheus metrics, logs JSON para Grafana Loki, SonarQube Quality Gate, GitOps via ArgoCD e HTTPS via AWS ACM.
  annotations:
    github.com/project-slug: cirodasilvaj/apps-demo-2026
    backstage.io/techdocs-ref: dir:.
    sonarqube.org/project-key: apps-demo-2026
    backstage.io/kubernetes-id: dotnet-csharp-app
    backstage.io/kubernetes-namespace: apps-demo
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    fluentd.io/destination: "loki"
    grafana/dashboard-selector: "dotnet-csharp-demo-app"
    grafana/tag-selector: "service:dotnet-csharp-demo-app"
    grafana/overview-dashboard: "http://grafana.992382723408.realhandsonlabs.net/d/dotnet-csharp-demo-app-dashboard/dd0f8fe"
    argocd/app-name: dotnet-csharp-app
  tags:
    - dotnet
    - csharp
    - sonarqube
    - prometheus
    - fluentd
    - loki
    - grafana
    - k8s
    - argocd
  links:
    - url: https://github.com/cirodasilvaj/apps-demo-2026/tree/main/dotnet-csharp-app
      title: GitHub Source Code
      icon: github
    - url: http://dotnet.992382723408.realhandsonlabs.net
      title: .NET 8 C# Live App (HTTP)
      icon: web
    - url: https://dotnet.992382723408.realhandsonlabs.net
      title: .NET 8 C# Live App (HTTPS ACM)
      icon: lock
    - url: http://dotnet.992382723408.realhandsonlabs.net/metrics
      title: Prometheus Metrics (/metrics)
      icon: gauge
    - url: http://grafana.992382723408.realhandsonlabs.net/d/dotnet-csharp-demo-app-dashboard/dd0f8fe
      title: Grafana Dashboard (Golden Signals & Loki Logs)
      icon: dashboard
    - url: http://sonarqube.992382723408.realhandsonlabs.net/dashboard?id=apps-demo-2026
      title: SonarQube Quality Gate
      icon: check
    - url: https://argocd.992382723408.realhandsonlabs.net/applications/dotnet-csharp-app
      title: ArgoCD GitOps
      icon: sync
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: apps-demo-2026
  providesApis:
    - dotnet-csharp-app-api
  dependsOn:
    - resource:default/kube-demo-eks
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: dotnet-csharp-app-api
  title: .NET 8 C# Minimal API REST API
  description: Interface REST para consulta de status, saúde e telemetria da aplicação C# .NET 8
spec:
  type: openapi
  lifecycle: production
  owner: platform-team
  system: apps-demo-2026
  definition: |
    openapi: "3.0.0"
    info:
      title: .NET 8 C# Minimal API
      version: "1.0.0"
    paths:
      /:
        get:
          summary: Overview & HTML Dashboard
          responses:
            '200':
              description: OK
      /api/info:
        get:
          summary: System & client runtime information
          responses:
            '200':
              description: OK
      /healthz:
        get:
          summary: Liveness probe
          responses:
            '200':
              description: OK
      /ready:
        get:
          summary: Readiness probe
          responses:
            '200':
              description: OK
      /metrics:
        get:
          summary: Prometheus metrics
          responses:
            '200':
              description: OK
